<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplicate Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div id="login-area">
        <h1 class="text-center pb-4">Welcome to Duplicate Bank</h1>
        <div class="submit-area">
            <h4 class="text-center pb-4">Login</h4>
            <input type="email" name="" placeholder="Input Your Email" id="" class="form-control"> <br>
            <input type="password" placeholder="Input Your Password" class="form-control" name="" id=""> <br>
            <!-- log in button -->
            <button class="btn btn-success" id="login-btn"> Login</button>
        </div>
    </div>
    <div id="dashboard">
        <div class="row text-center">
            <!-- Deposit Dashboadr -->
            <div class="col-md-4">
                <div class="deposit commmon">
                    <h5>Deposit</h5>
                <h3>$ <span id="current-deposit">00</span></h3>
                </div>
            </div>
             <!-- Widthdraw Dashboadr -->
            <div class="col-md-4">
                <div class="withdraw commmon">
                    <h5>Withdraw</h5>
                <h3>$ <span id="current-withdraw">00</span></h3>
                </div>
            </div>
             <!-- Balance Dashboadr -->
            <div class="col-md-4">
                <div class="balance commmon">
                    <h5>Balance</h5>
                <h3>$ <span id="current-balance">1000</span></h3>
                </div>
            </div>
        </div>
        <div class="row pt-5">
            <div class="col-md-6">
                <!-- Deposit input section  -->
               <div class="depo-withdraw-common">
                <h3 >Deposit</h3>
                <input type="text" class="form-control" id="deposit-amount" placeholder="$ amount you want to deposit"> <br>
                <!-- Deposit Button -->
                <button class="btn btn-success" id="depost-btn">Deposit</button>
               </div>
            </div>
            <!-- Withdraw input section  -->
            <div class="col-md-6">
               <div class="depo-withdraw-common">
                <h3>Withdraw</h3>
                <input type="text" class="form-control" id="withdraw-amount" placeholder="$ amount you want to withdraw"> <br>
                 <!-- Withdraw Button -->
                <button class="btn btn-success" id="withraw-btn">Withdraw</button>
                <span style="color: #02D9FA; font-size: 24px;">100+</span>
               </div>
            </div>
        </div>
    </div>
    
    <script>
        // event handler for login button
        let loginBtn = document.getElementById('login-btn');
        loginBtn.addEventListener('click', function(){
            let loginSection = document.getElementById('login-area');
            loginSection.style.display = "none"

            let dashboardSection = document.getElementById('dashboard');
            dashboardSection.style.display= 'block'
        })
         // event handler for deposit button
         let deospistBtn = document.getElementById('depost-btn');
         deospistBtn.addEventListener('click', function(){
            let depositAmount = document.getElementById('deposit-amount').value;
            depositAmount = parseFloat(depositAmount);

            let currentDeposit = document.getElementById('current-deposit').innerText;
            currentDeposit = parseFloat(currentDeposit);
            let toalDeposit = depositAmount + currentDeposit;

            document.getElementById('current-deposit').innerText = toalDeposit;

            document.getElementById('deposit-amount').value = '';

            let currentBalance = document.getElementById('current-balance').innerText;
            currentBalance = parseFloat(currentBalance);
            let finalBalance = depositAmount + currentBalance;

            document.getElementById('current-balance').innerText = finalBalance
         })
        // event handler for widthdraw button
        let withdrawBtn =  document.getElementById('withraw-btn');
        withdrawBtn.addEventListener('click', function(){
            let withdrawAmount = document.getElementById('withdraw-amount').value;
            withdrawAmount = parseFloat(withdrawAmount);

            let currentWithdraw = document.getElementById('current-withdraw').innerText;
            currentWithdraw = parseFloat(currentWithdraw);
            let toalWithdraw = withdrawAmount + currentWithdraw;

            document.getElementById('current-withdraw').innerText = toalWithdraw;

            document.getElementById('withdraw-amount').value = '';

            let currentBalance = document.getElementById('current-balance').innerText;
            currentBalance = parseFloat(currentBalance);
            let finalBalance = currentBalance - withdrawAmount;

            document.getElementById('current-balance').innerText = finalBalance
        })
    </script>
    
</body>
</html>
