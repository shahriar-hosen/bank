<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision Bank</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="welcome-area" class="text-center area-style" >
        <h1 class="pb-3">Welcome To Unsocial Bank</h1>
        <div id="login-area">
            <h4 class="pb-3">Log In</h4>
            <input type="email" name="" id="" placeholder="Type Your Email" class="form-control"> <br>
            <input type="password" name="" id="" placeholder="Type Your Password" class="form-control"> <br>
            <button class="btn btn-success" id="login-btn">Log In</button>
        </div>
    </div>
    <div id="dashboard-area" class="area-style">

  <div class="row text-center">
    <div class="col-md-4">
        <div class="status deposit">
    <!-- Deposit Status -->
            <h4>Deposit</h4>
            <h2>$ <span id="current-depo">00</span></h2>
        </div>
    </div>
    <div class="col-md-4">
        <div class="status withdraw">
    <!-- Withdraw Status -->
            <h4>Withdraw</h4>
            <h2>$ <span id="current-withdraw">00</span></h2>
        </div>
      
    </div>
    <div class="col-md-4">
        <div class="status balance">
    <!-- Balance Status -->
            <h4>Balance</h4>
            <h2>$ <span id="current-balance">1000</span></h2>
        </div>
    </div>
  </div>
  <div class="transaction-area py-5">
    <div class="row">
        <div class="col-md-6 ">
            <div class="transtyle">
    <!-- Doposit Area -->
                <h3>Deposit</h3>
            <input class="form-control" id="depo-amount" placeholder="$ amount you want to deposit"><br>
            <button class="btn btn-success" id="deposit-btn">Deposit</button>
            </div>
            </div>
        <div class="col-md-6">
            <div class="transtyle">
    <!-- Withdraw Area -->
                <h3>Withdraw</h3>
            <input class="form-control" placeholder="$ amount you want to withdraw" id="withdraw-amount"><br>
            <button class="btn btn-success" id="withdraw-btn">Withdraw</button>
            </div>
            </div>
    </div>
  </div>

    </div>
    <script>
        // Log In Button Event Handler
        let loginBtn = document.getElementById('login-btn');
        loginBtn.addEventListener('click', function () {
           let welcomeAre = document.getElementById('welcome-area');
           welcomeAre.style.display = 'none';
           let dashboardArea = document.getElementById('dashboard-area');
           dashboardArea.style.display = 'block'
    })
    // Depost Button Event Handler
    let depoBtn = document.getElementById('deposit-btn');
    depoBtn.addEventListener('click', function () {
        let depoAmount = document.getElementById('depo-amount').value;
        depoAmount = parseFloat(depoAmount) || 0
      // Deposit Status Update
        let currentDepo = document.getElementById('current-depo').innerText;
        currentDepo = parseFloat(currentDepo)
        let finalDepo = depoAmount + currentDepo;
        document.getElementById('current-depo').innerText = finalDepo;
        document.getElementById('depo-amount').value = ""
      // Balance Status Update for Deposit
        let currentBalance = document.getElementById('current-balance').innerText;
        currentBalance = parseFloat(currentBalance)
        toString
        let finalBalance = depoAmount + currentBalance;
        document.getElementById('current-balance').innerText = finalBalance
    })
    // Withdraw Button Event Handler
    let withdrawBtn = document.getElementById('withdraw-btn');
    withdrawBtn.addEventListener('click',function () {
        let withdrawAmount = document.getElementById('withdraw-amount').value;
        withdrawAmount = parseFloat(withdrawAmount) || 0;
        let currentWithdraw = document.getElementById('current-withdraw').innerText;
        currentWithdraw = parseFloat(currentWithdraw);
        let totalWithdraw = withdrawAmount + currentWithdraw;
        document.getElementById('current-withdraw').innerText = totalWithdraw;

        document.getElementById('withdraw-amount').value = ""

        // Balance Status Update for withdraw
        let currentBalance = document.getElementById('current-balance').innerText;
        currentBalance = parseFloat(currentBalance)
        let finalBalance = currentBalance - withdrawAmount;
        document.getElementById('current-balance').innerText = finalBalance

    })
    
    </script>
</body>
</html>
